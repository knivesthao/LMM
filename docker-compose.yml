services:
  dev:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-}
      - CHOKIDAR_USEPOLLING=true
    command: npx vite --host 0.0.0.0 --port 5173

  test:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CI=true
    command: npx vitest run

  test-e2e:
    build:
      context: .
      target: dev
    depends_on:
      - dev
    environment:
      - CI=true
    command: >
      sh -c "npx playwright install chromium-headless-shell &&
             npx playwright test --reporter=list"
